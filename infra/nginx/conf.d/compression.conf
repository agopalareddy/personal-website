# Compression (http context).
#
# nginx.conf has `gzip on`, which by itself compresses text/html only, so the
# stylesheets and scripts went out at full size (primer.css: 632 KB instead of
# about 100 KB). This adds the static text types.
#
# application/json is left out on purpose: the proxied apps answer API calls
# with it, and compressing responses that mix a secret with request input is
# what the BREACH attack needs. The static JSON here is small.

gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/css
    application/javascript
    text/javascript
    image/svg+xml
    application/xml
    text/xml
    text/plain
    application/manifest+json;
