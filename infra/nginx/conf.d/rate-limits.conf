# Rate limit zones (http context).
#
# email-finder performs outbound SMTP checks, so a flood of requests costs more
# than CPU — it spends the server's mail reputation. The application enforces
# per-user quotas and a global probe budget; this is the cheap edge layer that
# stops abuse before it reaches Python at all.
#
# 10m holds roughly 160k addresses.

# General traffic, including submitting a lookup (which costs SMTP probes).
limit_req_zone $binary_remote_addr zone=emailverify:10m rate=30r/m;

# Polling a running job. Deliberately generous: the client polls roughly once
# a second while a lookup runs, so a limit sized for normal browsing would cut
# off any lookup lasting more than about twenty seconds. These reads cost a
# dictionary lookup and no outbound mail traffic at all.
limit_req_zone $binary_remote_addr zone=emailverifypoll:10m rate=180r/m;

# Sign-in and sign-up: much tighter, since these are the credential-guessing
# targets and each attempt costs an Argon2 hash.
limit_req_zone $binary_remote_addr zone=emailverifyauth:10m rate=10r/m;

limit_conn_zone $binary_remote_addr zone=emailverifyconn:10m;
